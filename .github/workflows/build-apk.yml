name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git zip unzip ccache autoconf automake libtool \
            pkg-config cmake zlib1g-dev libncurses5-dev libncursesw5-dev \
            libffi-dev libssl-dev python3-pip
          sudo apt-get install -y libtinfo5 || sudo apt-get install -y libtinfo6

      - name: Cache Buildozer global dir (Android SDK/NDK, p4a)
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-v2-global-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-v2-global-${{ runner.os }}-

      - name: Cache local .buildozer folder
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: buildozer-v2-local-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-v2-local-${{ runner.os }}-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-v2-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            gradle-v2-${{ runner.os }}-

      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install "buildozer==1.5.0" "cython==0.29.36" virtualenv

      - name: Build debug APK
        env:
          BUILDOZER_WARN_ON_ROOT: "0"
        run: buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: folklore-guide-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14
